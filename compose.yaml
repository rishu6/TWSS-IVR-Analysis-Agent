services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: callatlas
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-local-only
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d callatlas"]
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
  backend:
    build: {context: ., dockerfile: infra/backend.Dockerfile}
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: {context: ., dockerfile: infra/backend.Dockerfile}
    env_file: .env
    command: ["celery", "-A", "app.jobs.celery", "worker", "--loglevel=warning"]
    depends_on: [backend, redis]
  scheduler:
    build: {context: ., dockerfile: infra/backend.Dockerfile}
    env_file: .env
    command: ["celery", "-A", "app.jobs.celery", "beat", "--loglevel=warning", "--schedule=/tmp/celerybeat"]
    depends_on: [backend, redis]
  frontend:
    build: {context: ., dockerfile: infra/frontend.Dockerfile}
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]
volumes:
  postgres-data:
